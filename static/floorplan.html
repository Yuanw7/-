<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>适老化改造平面图编辑器</title>

    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <!-- 样式 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部工具栏 */
        .toolbar {
            background: #16213e;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #0f3460;
        }

        .toolbar h1 {
            font-size: 18px;
            color: #e94560;
            font-weight: 600;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar label {
            font-size: 13px;
            color: #a0a0a0;
        }

        select, input {
            background: #0f3460;
            border: 1px solid #e94560;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        button:hover {
            background: #c73e54;
        }

        button.secondary {
            background: #0f3460;
        }

        button.secondary:hover {
            background: #1a4a7a;
        }

        /* 主内容区 */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧工具面板 */
        .left-panel {
            width: 280px;
            background: #16213e;
            padding: 16px;
            overflow-y: auto;
            border-right: 1px solid #0f3460;
        }

        .panel-section {
            margin-bottom: 20px;
        }

        .panel-section h3 {
            font-size: 14px;
            color: #e94560;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #0f3460;
        }

        /* 家具列表 */
        .furniture-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .furniture-item {
            background: #0f3460;
            padding: 10px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .furniture-item:hover {
            background: #1a4a7a;
        }

        .furniture-item.selected {
            background: #e94560;
        }

        .furniture-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        .furniture-info {
            flex: 1;
        }

        .furniture-name {
            font-size: 13px;
            font-weight: 500;
        }

        .furniture-dims {
            font-size: 11px;
            color: #a0a0a0;
        }

        /* 属性面板 */
        .property-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .property-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .property-item.full-width {
            grid-column: 1 / -1;
        }

        .property-item label {
            font-size: 11px;
            color: #a0a0a0;
        }

        .property-item input {
            width: 100%;
            padding: 6px 8px;
        }

        /* 审计结果面板 */
        .audit-panel {
            background: #0f3460;
            border-radius: 6px;
            padding: 12px;
        }

        .audit-score {
            text-align: center;
            margin-bottom: 12px;
        }

        .audit-score .score {
            font-size: 36px;
            font-weight: 700;
            color: #4ade80;
        }

        .audit-score .score.warning {
            color: #fbbf24;
        }

        .audit-score .score.danger {
            color: #ef4444;
        }

        .audit-score .label {
            font-size: 12px;
            color: #a0a0a0;
        }

        .violation-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .violation-item {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-radius: 0 4px 4px 0;
            font-size: 12px;
        }

        .violation-item.t1 {
            background: rgba(251, 191, 36, 0.1);
            border-left-color: #fbbf24;
        }

        .violation-item.t2 {
            background: rgba(74, 222, 128, 0.1);
            border-left-color: #4ade80;
        }

        .violation-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .violation-detail {
            color: #a0a0a0;
            font-size: 11px;
        }

        /* 画布区域 */
        .canvas-container {
            flex: 1;
            position: relative;
            background: #0a0a1a;
            overflow: hidden;
        }

        #floorplan-canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            box-shadow: 0 0 40px rgba(233, 69, 96, 0.3);
            border-radius: 4px;
        }

        /* 房间标尺 */
        .ruler-h, .ruler-v {
            position: absolute;
            background: #16213e;
            z-index: 10;
        }

        .ruler-h {
            top: 0;
            left: 60px;
            right: 0;
            height: 30px;
        }

        .ruler-v {
            top: 30px;
            left: 0;
            bottom: 0;
            width: 30px;
        }

        /* 状态栏 */
        .status-bar {
            background: #16213e;
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0a0a0;
            border-top: 1px solid #0f3460;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.disconnected {
            background: #ef4444;
        }

        /* Toast 通知 */
        .toast {
            position: fixed;
            bottom: 60px;
            right: 20px;
            background: #16213e;
            border: 1px solid #e94560;
            padding: 12px 20px;
            border-radius: 6px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <h1>适老化改造平面图编辑器</h1>

        <div class="toolbar-group">
            <label>房间类型</label>
            <select id="room-type">
                <option value="客厅">客厅</option>
                <option value="卧室">卧室</option>
                <option value="卫生间">卫生间</option>
                <option value="厨房">厨房</option>
            </select>
        </div>

        <div class="toolbar-group">
            <label>房间尺寸</label>
            <input type="number" id="room-width" value="6000" style="width: 80px;"> mm ×
            <input type="number" id="room-depth" value="4500" style="width: 80px;"> mm
        </div>

        <div class="toolbar-group">
            <button id="btn-generate">AI 生成布局</button>
            <button id="btn-audit" class="secondary">立即审计</button>
            <button id="btn-save" class="secondary">保存</button>
        </div>

        <div class="toolbar-group" style="margin-left: auto;">
            <button id="btn-zoom-in" class="secondary">+</button>
            <span id="zoom-level" style="min-width: 50px; text-align: center;">100%</span>
            <button id="btn-zoom-out" class="secondary">-</button>
            <button id="btn-reset" class="secondary">重置视角</button>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 左侧工具面板 -->
        <div class="left-panel">
            <!-- 选中家具属性 -->
            <div class="panel-section">
                <h3>家具属性</h3>
                <div id="property-panel" class="property-grid" style="display: none;">
                    <div class="property-item full-width">
                        <label>名称</label>
                        <input type="text" id="prop-label" placeholder="家具名称">
                    </div>
                    <div class="property-item">
                        <label>中心 X (mm)</label>
                        <input type="number" id="prop-cx">
                    </div>
                    <div class="property-item">
                        <label>中心 Y (mm)</label>
                        <input type="number" id="prop-cy">
                    </div>
                    <div class="property-item">
                        <label>宽度 (mm)</label>
                        <input type="number" id="prop-w">
                    </div>
                    <div class="property-item">
                        <label>深度 (mm)</label>
                        <input type="number" id="prop-d">
                    </div>
                    <div class="property-item full-width">
                        <label>旋转角度 (°)</label>
                        <input type="number" id="prop-rotation" min="-180" max="180">
                    </div>
                    <div class="property-item full-width">
                        <label>材质</label>
                        <select id="prop-material">
                            <option value="木质">木质</option>
                            <option value="实木">实木</option>
                            <option value="人造板">人造板</option>
                            <option value="金属">金属</option>
                            <option value="玻璃">玻璃</option>
                            <option value="石材">石材</option>
                            <option value="布艺">布艺</option>
                            <option value="皮革">皮革</option>
                        </select>
                    </div>
                </div>
                <div id="no-selection" style="color: #a0a0a0; font-size: 13px; text-align: center; padding: 20px;">
                    选择家具以编辑属性
                </div>
            </div>

            <!-- 审计结果 -->
            <div class="panel-section">
                <h3>合规审计</h3>
                <div class="audit-panel">
                    <div class="audit-score">
                        <div id="audit-score" class="score">--</div>
                        <div class="label">合规分数</div>
                    </div>
                    <div id="violation-list" class="violation-list">
                        <!-- 违规项将在这里显示 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 画布区域 -->
        <div class="canvas-container" id="canvas-container">
            <canvas id="floorplan-canvas"></canvas>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-item">
            <span id="ws-status" class="status-dot disconnected"></span>
            <span id="ws-status-text">WebSocket 未连接</span>
        </div>
        <div class="status-item">
            <span id="mouse-pos">X: 0, Y: 0</span>
        </div>
        <div class="status-item">
            <span id="furniture-count">家具数量: 0</span>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════════
        // 常量配置
        // ═══════════════════════════════════════════════════════════════════════════

        const SCALE = 0.1; // 1px = 0.1mm (画布上显示的比例)

        const MATERIAL_COLORS = {
            '木质': '#8B4513',
            '实木': '#A0522D',
            '人造板': '#DEB887',
            '金属': '#708090',
            '不锈钢': '#C0C0C0',
            '铝合金': '#B8B8B8',
            '玻璃': '#87CEEB',
            '钢化玻璃': '#ADD8E6',
            '石材': '#808080',
            '大理石': '#D3D3D3',
            '瓷砖': '#F5F5F5',
            '陶瓷': '#FFFAF0',
            '皮革': '#8B0000',
            '布艺': '#DEB887',
            '织物': '#F5DEB3',
            '塑料': '#FFB6C1',
            '未知': '#D3D3D3',
        };

        const CLEARANCE_STANDARDS = {
            'wheelchair_passage': 900,
            'bed_side_clearance': 600,
            'door_access_clearance': 800,
        };

        // ═══════════════════════════════════════════════════════════════════════════
        // 状态管理
        // ═══════════════════════════════════════════════════════════════════════════

        const state = {
            room: { width: 6000, depth: 4500 },
            furniture: [],
            selectedId: null,
            canvas: null,
            zoom: 1,
            ws: null,
            auditResults: null,
        };

        // ═══════════════════════════════════════════════════════════════════════════
        // Fabric.js 画布初始化
        // ═══════════════════════════════════════════════════════════════════════════

        function initCanvas() {
            const container = document.getElementById('canvas-container');
            const canvasEl = document.getElementById('floorplan-canvas');

            // 设置画布尺寸
            const canvasWidth = state.room.width * SCALE;
            const canvasHeight = state.room.depth * SCALE;

            canvasEl.width = canvasWidth;
            canvasEl.height = canvasHeight;

            // 初始化 Fabric.js
            state.canvas = new fabric.Canvas('floorplan-canvas', {
                selection: true,
                backgroundColor: '#ffffff',
            });

            // 绘制房间边界
            drawRoomBoundary();

            // 事件监听
            setupCanvasEvents();

            // 渲染
            state.canvas.renderAll();
        }

        function drawRoomBoundary() {
            const canvasWidth = state.room.width * SCALE;
            const canvasHeight = state.room.depth * SCALE;

            // 房间背景
            const roomRect = new fabric.Rect({
                left: 0,
                top: 0,
                width: canvasWidth,
                height: canvasHeight,
                fill: '#f8f8f8',
                stroke: '#333',
                strokeWidth: 2,
                selectable: false,
                evented: false,
                name: 'room_boundary',
            });

            state.canvas.add(roomRect);

            // 绘制网格
            const gridSize = 500 * SCALE; // 500mm 网格
            const gridLines = [];

            for (let x = gridSize; x < canvasWidth; x += gridSize) {
                gridLines.push(new fabric.Line([x, 0, x, canvasHeight], {
                    stroke: '#e0e0e0',
                    strokeWidth: 1,
                    selectable: false,
                    evented: false,
                }));
            }

            for (let y = gridSize; y < canvasHeight; y += gridSize) {
                gridLines.push(new fabric.Line([0, y, canvasWidth, y], {
                    stroke: '#e0e0e0',
                    strokeWidth: 1,
                    selectable: false,
                    evented: false,
                }));
            }

            gridLines.forEach(line => state.canvas.add(line));

            // 绘制门
            drawDoor();
        }

        function drawDoor() {
            // 简化的门表示
            const doorWidth = 800 * SCALE;
            const doorHeight = 50;

            const door = new fabric.Rect({
                left: 100,
                top: 0,
                width: doorWidth,
                height: doorHeight,
                fill: '#4ade80',
                stroke: '#22c55e',
                strokeWidth: 2,
                selectable: false,
                evented: false,
                name: 'door',
            });

            state.canvas.add(door);
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // 家具渲染
        // ═══════════════════════════════════════════════════════════════════════════

        function renderFurniture() {
            // 清除现有家具（保留房间背景）
            const toRemove = [];
            state.canvas.forEachObject(obj => {
                if (obj.name !== 'room_boundary' && obj.name !== 'door') {
                    toRemove.push(obj);
                }
            });
            toRemove.forEach(obj => state.canvas.remove(obj));

            // 渲染家具
            state.furniture.forEach(item => {
                addFurnitureToCanvas(item);
            });

            // 更新状态栏
            document.getElementById('furniture-count').textContent = `家具数量: ${state.furniture.length}`;

            state.canvas.renderAll();
        }

        function addFurnitureToCanvas(item) {
            const cx = item.center[0] * SCALE;
            const cy = item.center[1] * SCALE;
            const w = item.size[0] * SCALE;
            const d = item.size[1] * SCALE;

            const color = MATERIAL_COLORS[item.material] || MATERIAL_COLORS['未知'];

            const rect = new fabric.Rect({
                left: cx,
                top: cy,
                width: w,
                height: d,
                fill: color,
                stroke: '#333',
                strokeWidth: 1,
                angle: item.rotation,
                originX: 'center',
                originY: 'center',
                cornerColor: '#e94560',
                cornerStrokeColor: '#e94560',
                cornerSize: 10,
                transparentCorners: false,
                hasControls: true,
                hasBorders: true,
                lockRotation: false,
                name: item.id,
                data: item,
            });

            // 添加标签
            const label = new fabric.Text(item.label, {
                left: cx,
                top: cy,
                fontSize: 12,
                fill: '#fff',
                originX: 'center',
                originY: 'center',
                selectable: false,
                evented: false,
                name: `${item.id}_label`,
            });

            state.canvas.add(rect);
            state.canvas.add(label);

            // 拖拽时更新标签位置
            rect.on('moving', () => {
                label.set({
                    left: rect.left,
                    top: rect.top,
                    angle: rect.angle,
                });
                updateMousePos(rect.left, rect.top);
            });

            rect.on('rotating', () => {
                label.set({
                    left: rect.left,
                    top: rect.top,
                    angle: rect.angle,
                });
            });

            rect.on('scaling', () => {
                label.set({
                    left: rect.left,
                    top: rect.top,
                    scaleX: rect.scaleX,
                    scaleY: rect.scaleY,
                });
            });

            rect.on('mousedown', () => {
                selectFurniture(item.id);
            });

            rect.on('mouseup', () => {
                // 同步状态
                syncFromCanvas(item.id);
                // 发送审计请求
                sendAuditRequest();
            });
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // 选择与属性编辑
        // ═══════════════════════════════════════════════════════════════════════════

        function selectFurniture(id) {
            state.selectedId = id;

            // 更新列表选中状态
            document.querySelectorAll('.furniture-item').forEach(el => {
                el.classList.toggle('selected', el.dataset.id === id);
            });

            // 更新属性面板
            const item = state.furniture.find(f => f.id === id);
            if (item) {
                document.getElementById('property-panel').style.display = 'grid';
                document.getElementById('no-selection').style.display = 'none';

                document.getElementById('prop-label').value = item.label;
                document.getElementById('prop-cx').value = Math.round(item.center[0]);
                document.getElementById('prop-cy').value = Math.round(item.center[1]);
                document.getElementById('prop-w').value = Math.round(item.size[0]);
                document.getElementById('prop-d').value = Math.round(item.size[1]);
                document.getElementById('prop-rotation').value = item.rotation;
                document.getElementById('prop-material').value = item.material;
            }
        }

        function syncFromCanvas(id) {
            const item = state.furniture.find(f => f.id === id);
            if (!item) return;

            // 从画布同步位置
            state.canvas.forEachObject(obj => {
                if (obj.name === id) {
                    item.center[0] = obj.left / SCALE;
                    item.center[1] = obj.top / SCALE;
                    item.rotation = obj.angle;
                    item.size[0] = obj.width * obj.scaleX / SCALE;
                    item.size[1] = obj.height * obj.scaleY / SCALE;

                    // 重置缩放
                    obj.scaleX = 1;
                    obj.scaleY = 1;
                    obj.width = item.size[0] * SCALE;
                    obj.height = item.size[1] * SCALE;
                    obj.setCoords();
                }
            });
        }

        function updatePropertyPanel() {
            if (!state.selectedId) return;

            const item = state.furniture.find(f => f.id === state.selectedId);
            if (!item) return;

            document.getElementById('prop-cx').value = Math.round(item.center[0]);
            document.getElementById('prop-cy').value = Math.round(item.center[1]);
            document.getElementById('prop-w').value = Math.round(item.size[0]);
            document.getElementById('prop-d').value = Math.round(item.size[1]);
            document.getElementById('prop-rotation').value = item.rotation;
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // 画布事件
        // ═══════════════════════════════════════════════════════════════════════════

        function setupCanvasEvents() {
            // 鼠标移动
            state.canvas.on('mouse:move', (opt) => {
                const pointer = state.canvas.getPointer(opt.e);
                updateMousePos(pointer.x, pointer.y);
            });

            // 点击空白区域取消选择
            state.canvas.on('mouse:down', (opt) => {
                if (opt.target === null) {
                    state.selectedId = null;
                    document.getElementById('property-panel').style.display = 'none';
                    document.getElementById('no-selection').style.display = 'block';

                    document.querySelectorAll('.furniture-item').forEach(el => {
                        el.classList.remove('selected');
                    });
                }
            });
        }

        function updateMousePos(x, y) {
            const mmX = Math.round(x / SCALE);
            const mmY = Math.round(y / SCALE);
            document.getElementById('mouse-pos').textContent = `X: ${mmX}mm, Y: ${mmY}mm`;
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // 审计功能
        // ═══════════════════════════════════════════════════════════════════════════

        async function sendAuditRequest() {
            if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
                // Fallback: HTTP 请求
                try {
                    const response = await fetch('/api/audit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            canvas_state: {
                                room: state.room,
                                furniture: state.furniture,
                            },
                            room_type: document.getElementById('room-type').value,
                        }),
                    });

                    const result = await response.json();
                    updateAuditUI(result);
                } catch (err) {
                    console.error('审计请求失败:', err);
                }
                return;
            }

            // WebSocket 发送
            state.ws.send(JSON.stringify({
                type: 'state_update',
                payload: {
                    room: state.room,
                    furniture: state.furniture,
                    room_type: document.getElementById('room-type').value,
                },
            }));
        }

        function updateAuditUI(result) {
            state.auditResults = result;

            // 更新分数
            const scoreEl = document.getElementById('audit-score');
            scoreEl.textContent = result.compliance_score;

            scoreEl.classList.remove('warning', 'danger');
            if (result.compliance_score < 60) {
                scoreEl.classList.add('danger');
            } else if (result.compliance_score < 80) {
                scoreEl.classList.add('warning');
            }

            // 更新违规列表
            const listEl = document.getElementById('violation-list');
            listEl.innerHTML = '';

            if (result.violations.length === 0) {
                listEl.innerHTML = '<div style="color: #4ade80; text-align: center; padding: 20px;">✓ 无违规项</div>';
                return;
            }

            result.violations.forEach(v => {
                const div = document.createElement('div');
                div.className = `violation-item ${v.severity.toLowerCase()}`;
                div.innerHTML = `
                    <div class="violation-title">${v.severity} ${v.source_id} ↔ ${v.target_id}</div>
                    <div class="violation-detail">
                        实测: ${Math.round(v.actual_clearance_mm)}mm / 要求: ${v.required_clearance_mm}mm
                    </div>
                    <div class="violation-detail">${v.suggestion}</div>
                `;
                listEl.appendChild(div);
            });

            // 高亮违规家具
            highlightViolations(result.violations);
        }

        function highlightViolations(violations) {
            // 重置所有家具颜色
            state.furniture.forEach(item => {
                state.canvas.forEachObject(obj => {
                    if (obj.name === item.id) {
                        obj.set('stroke', '#333');
                        obj.set('strokeWidth', 1);
                    }
                });
            });

            // 高亮违规家具
            violations.forEach(v => {
                [v.source_id, v.target_id].forEach(id => {
                    state.canvas.forEachObject(obj => {
                        if (obj.name === id) {
                            const color = v.severity === 'T0' ? '#ef4444' :
                                         v.severity === 'T1' ? '#fbbf24' : '#4ade80';
                            obj.set('stroke', color);
                            obj.set('strokeWidth', 3);
                        }
                    });
                });
            });

            state.canvas.renderAll();
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // WebSocket 连接
        // ═══════════════════════════════════════════════════════════════════════════

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/audit`;

            try {
                state.ws = new WebSocket(wsUrl);

                state.ws.onopen = () => {
                    document.getElementById('ws-status').classList.remove('disconnected');
                    document.getElementById('ws-status-text').textContent = 'WebSocket 已连接';
                    showToast('实时审计已启用');
                };

                state.ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'audit_result') {
                        updateAuditUI(msg.payload);
                    }
                };

                state.ws.onclose = () => {
                    document.getElementById('ws-status').classList.add('disconnected');
                    document.getElementById('ws-status-text').textContent = 'WebSocket 已断开';
                    // 重连
                    setTimeout(connectWebSocket, 3000);
                };

                state.ws.onerror = (err) => {
                    console.error('WebSocket 错误:', err);
                };
            } catch (err) {
                console.error('WebSocket 连接失败:', err);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // API 操作
        // ═══════════════════════════════════════════════════════════════════════════

        async function generateLayout() {
            const roomType = document.getElementById('room-type').value;
            const roomWidth = parseFloat(document.getElementById('room-width').value);
            const roomDepth = parseFloat(document.getElementById('room-depth').value);

            try {
                const response = await fetch(`/api/generate-layout?room_type=${roomType}&room_width=${roomWidth}&room_depth=${roomDepth}`);
                const data = await response.json();

                // 更新状态
                state.room = data.room;
                state.furniture = data.furniture;

                // 重新初始化画布
                initCanvas();
                renderFurniture();

                showToast('AI 布局已生成');
            } catch (err) {
                console.error('生成布局失败:', err);
                showToast('生成布局失败');
            }
        }

        async function saveLayout() {
            try {
                const response = await fetch('/api/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        canvas_state: {
                            room: state.room,
                            furniture: state.furniture,
                        },
                        room_type: document.getElementById('room-type').value,
                    }),
                });

                const auditResult = await response.json();

                const saveData = {
                    room: state.room,
                    furniture: state.furniture,
                    audit: auditResult,
                    saved_at: new Date().toISOString(),
                };

                // 下载 JSON 文件
                const blob = new Blob([JSON.stringify(saveData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `floorplan_${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);

                showToast('布局已保存');
            } catch (err) {
                console.error('保存失败:', err);
                showToast('保存失败');
            }
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // 工具函数
        // ═══════════════════════════════════════════════════════════════════════════

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // 缩放控制
        // ═══════════════════════════════════════════════════════════════════════════

        function zoomIn() {
            state.zoom = Math.min(state.zoom + 0.1, 3);
            updateZoom();
        }

        function zoomOut() {
            state.zoom = Math.max(state.zoom - 0.1, 0.3);
            updateZoom();
        }

        function resetZoom() {
            state.zoom = 1;
            updateZoom();
        }

        function updateZoom() {
            state.canvas.setZoom(state.zoom);
            document.getElementById('zoom-level').textContent = `${Math.round(state.zoom * 100)}%`;
            state.canvas.renderAll();
        }

        // ═══════════════════════════════════════════════════════════════════════════
        // 事件绑定
        // ═══════════════════════════════════════════════════════════════════════════

        document.getElementById('btn-generate').addEventListener('click', generateLayout);
        document.getElementById('btn-audit').addEventListener('click', sendAuditRequest);
        document.getElementById('btn-save').addEventListener('click', saveLayout);
        document.getElementById('btn-zoom-in').addEventListener('click', zoomIn);
        document.getElementById('btn-zoom-out').addEventListener('click', zoomOut);
        document.getElementById('btn-reset').addEventListener('click', resetZoom);

        // 属性编辑
        ['prop-cx', 'prop-cy', 'prop-w', 'prop-d', 'prop-rotation'].forEach(id => {
            document.getElementById(id).addEventListener('change', (e) => {
                if (!state.selectedId) return;

                const item = state.furniture.find(f => f.id === state.selectedId);
                if (!item) return;

                const value = parseFloat(e.target.value) || 0;

                switch (id) {
                    case 'prop-cx':
                        item.center[0] = value;
                        break;
                    case 'prop-cy':
                        item.center[1] = value;
                        break;
                    case 'prop-w':
                        item.size[0] = value;
                        break;
                    case 'prop-d':
                        item.size[1] = value;
                        break;
                    case 'prop-rotation':
                        item.rotation = value;
                        break;
                }

                renderFurniture();
                sendAuditRequest();
            });
        });

        document.getElementById('prop-material').addEventListener('change', (e) => {
            if (!state.selectedId) return;

            const item = state.furniture.find(f => f.id === state.selectedId);
            if (item) {
                item.material = e.target.value;
                renderFurniture();
            }
        });

        document.getElementById('prop-label').addEventListener('change', (e) => {
            if (!state.selectedId) return;

            const item = state.furniture.find(f => f.id === state.selectedId);
            if (item) {
                item.label = e.target.value;

                // 更新标签
                state.canvas.forEachObject(obj => {
                    if (obj.name === `${state.selectedId}_label`) {
                        obj.set('text', item.label);
                    }
                });
                state.canvas.renderAll();
            }
        });

        // 房间类型变更
        document.getElementById('room-type').addEventListener('change', () => {
            sendAuditRequest();
        });

        // ═══════════════════════════════════════════════════════════════════════════
        // 初始化
        // ═══════════════════════════════════════════════════════════════════════════

        document.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            connectWebSocket();

            // 初始加载示例数据
            generateLayout();
        });
    </script>
</body>
</html>
